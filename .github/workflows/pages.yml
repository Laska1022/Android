name: Publish Robots vs Aliens to GitHub Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
defaults:
  run:
    working-directory: apps/robots-vs-aliens
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/robots-vs-aliens/.nvmrc
          cache: npm
          cache-dependency-path: apps/robots-vs-aliens/package-lock.json
      - run: npm ci
      - run: npm run test && npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/robots-vs-aliens/dist
      - id: deployment
        uses: actions/deploy-pages@v4
