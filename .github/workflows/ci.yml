name: Robots vs Aliens - build and test
on:
  push:
    branches: [main]
    paths:
      - 'apps/robots-vs-aliens/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'apps/robots-vs-aliens/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    working-directory: apps/robots-vs-aliens
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/robots-vs-aliens/.nvmrc
          cache: npm
          cache-dependency-path: apps/robots-vs-aliens/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robots-vs-aliens-browser-tests
          path: apps/robots-vs-aliens/test-results/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: robots-vs-aliens-web-build
          path: apps/robots-vs-aliens/dist/
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/robots-vs-aliens/.nvmrc
          cache: npm
          cache-dependency-path: apps/robots-vs-aliens/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run android:sync
      - run: ./gradlew --no-daemon --max-workers=2 assembleDebug lintDebug
        working-directory: apps/robots-vs-aliens/android
      - uses: actions/upload-artifact@v4
        with:
          name: robots-vs-aliens-debug-apk
          path: apps/robots-vs-aliens/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
