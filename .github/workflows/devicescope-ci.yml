name: DeviceScope native checks
on:
  push:
    paths: ['apps/devicescope/**', '.github/workflows/devicescope-ci.yml']
  pull_request:
    paths: ['apps/devicescope/**', '.github/workflows/devicescope-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/devicescope
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: ./gradlew --no-daemon --max-workers=2 testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: devicescope-check-results
          path: |
            apps/devicescope/**/build/reports/
            apps/devicescope/**/build/test-results/
      - uses: actions/upload-artifact@v4
        with:
          name: devicescope-debug-apk
          path: apps/devicescope/app/build/outputs/apk/debug/app-debug.apk
